<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผังวงจรชีวิตการทำงานระบบพัสดุและสัญญา - กองโรคติดต่อทั่วไป กรมควบคุมโรค</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Sarabun', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-bar {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .title-box h1 {
      margin: 0;
      font-family: 'Prompt', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8;
    }
    .title-box p {
      margin: 4px 0 0 0;
      font-size: 14px;
      color: #94a3b8;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .svg-wrapper {
      width: 100%;
      max-width: 1200px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      padding: 10px;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-box">
      <h1>ผังกระบวนการทำงานระบบพัสดุและสัญญา (Procurement Lifecycle)</h1>
      <p>กองโรคติดต่อทั่วไป กรมควบคุมโรค กระทรวงสาธารณสุข</p>
    </div>
    <div class="btn-group">
      <a href="procurement-flowchart.svg" download="procurement-flowchart.svg" class="btn btn-primary">
        📥 ดาวน์โหลดไฟล์ภาพ (SVG)
      </a>
      <button onclick="window.print()" class="btn btn-secondary">
        🖨️ สั่งพิมพ์ (Print / PDF)
      </button>
    </div>
  </div>

  <div class="svg-wrapper">
    <img src="procurement-flowchart.svg" alt="ผังวงจรชีวิตระบบพัสดุและสัญญา" style="width: 100%; height: auto;" />
  </div>

</body>
</html>
